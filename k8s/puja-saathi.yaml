# Two deployments from the same image:
#   puja-saathi-web  (1 replica)  UI + API + control room + rush generator. Exposed on :8787.
#   puja-saathi      (2 → N)      the guide's session workers. This is what devotees load
#                                 at the muhurat, and what NudgeBee scales.
apiVersion: v1
kind: Namespace
metadata:
  name: puja-saathi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: puja-saathi-web
  namespace: puja-saathi
  labels: { app: puja-saathi-web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: puja-saathi-web }
  template:
    metadata:
      labels: { app: puja-saathi-web }
    spec:
      containers:
        - name: web
          image: puja-saathi:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8787, name: http }]
          envFrom:
            - secretRef: { name: puja-saathi-env }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: RUSH_TARGET_URL
              value: http://puja-saathi.puja-saathi.svc.cluster.local
          resources:
            requests: { cpu: 200m, memory: 192Mi }
            limits: { cpu: "1", memory: 384Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: puja-saathi
  namespace: puja-saathi
  labels: { app: puja-saathi }
spec:
  replicas: 2
  selector:
    matchLabels: { app: puja-saathi }
  template:
    metadata:
      labels: { app: puja-saathi }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8787"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: guide
          image: puja-saathi:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8787, name: http }]
          envFrom:
            - secretRef: { name: puja-saathi-env }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: DISABLE_PROBE
              value: "1"
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: puja-saathi
  namespace: puja-saathi
spec:
  selector: { app: puja-saathi }
  ports:
    - port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: puja-saathi-web
  namespace: puja-saathi
spec:
  type: NodePort
  selector: { app: puja-saathi-web }
  ports:
    - port: 80
      targetPort: http
      nodePort: 30087
